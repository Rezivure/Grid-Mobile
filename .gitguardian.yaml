version: 2

secret:
  ignored-matches:
    # Cloudflare Turnstile SITE key. Public by design — it is embedded in the
    # widget's HTML on every page that renders a challenge, and ships inside
    # the app binary. The confidential half is the Turnstile SECRET key, which
    # lives only in the middleware's `middleware-secrets` Kubernetes secret and
    # is never in this repo.
    #
    # It appears here in lib/screens/onboarding/server_select_screen.dart as a
    # fallback (a missing .env entry must not brick account creation) and in
    # the .env blocks generated by the release workflows.
    - name: Cloudflare Turnstile site key (public)
      match: 0x4AAAAAACuoM-Fe6MODnKzk
