name: Changelog

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  validate:
    name: Changelog Entry
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.parse.outputs.skip }}
      type: ${{ steps.parse.outputs.type }}
      note: ${{ steps.parse.outputs.note }}
    steps:
      # No checkout needed - everything comes from the PR body in the event
      # payload, so this works for PRs opened from a fork too.
      - name: Parse PR body
        id: parse
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$PR_BODY" | grep -q '\[x\] `skip`'; then
            echo "✅ Changelog skipped"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          elif echo "$PR_BODY" | grep -q '\[x\] `feature`'; then
            TYPE="feature"
          elif echo "$PR_BODY" | grep -q '\[x\] `fix`'; then
            TYPE="fix"
          elif echo "$PR_BODY" | grep -q '\[x\] `improvement`'; then
            TYPE="improvement"
          else
            echo "::error::No changelog type selected. Check a box in the PR description."
            exit 1
          fi

          NOTE=$(echo "$PR_BODY" | sed -n '/\*\*Release note:\*\*/,/^$/p' | grep -v '^\*\*Release note' | grep -v '^<!--' | grep -v '^$' | head -1 | xargs)

          if [ -z "$NOTE" ]; then
            echo "::error::Release note is empty. Add a one-liner under **Release note:** in the PR description."
            exit 1
          fi

          echo "📝 [${TYPE}] ${NOTE}"
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "type=${TYPE}" >> $GITHUB_OUTPUT
          echo "note=${NOTE}" >> $GITHUB_OUTPUT

  commit:
    name: Commit Changelog Entry
    needs: validate
    # Only for PRs from a branch in this repo. The repo token has no write
    # access to a contributor's fork, so for fork PRs the entry is added by
    # the maintainer at merge time instead.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history and tags: the sweep below needs the release tags to
          # tell a released note from a pending one.
          fetch-depth: 0

      - name: Write and commit change file
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SKIP: ${{ needs.validate.outputs.skip }}
          TYPE: ${{ needs.validate.outputs.type }}
          NOTE: ${{ needs.validate.outputs.note }}
        run: |
          CHANGE_FILE="changes/pr-${PR_NUMBER}.md"

          if [ "$SKIP" = "true" ]; then
            rm -f "$CHANGE_FILE"
          else
            echo "[${TYPE}] ${NOTE}" > "$CHANGE_FILE"
          fi

          # Sweep out notes that a release has already shipped. A note is
          # pending if its file was added after the newest release tag;
          # anything older was consumed by that release and is dead weight.
          # The release job cannot do this itself — it would have to push to
          # main, which requires a reviewed pull request.
          LAST_TAG=$(git tag --list 'v*' --sort=-creatordate | head -1)
          if [ -n "$LAST_TAG" ]; then
            PENDING=$(git diff --name-only --diff-filter=A "${LAST_TAG}..HEAD" -- changes 2>/dev/null \
              | grep -E '^changes/pr-[0-9]+\.md$' || true)
            for f in changes/pr-*.md; do
              [ -e "$f" ] || continue
              # Never touch this PR's own entry - it is not committed yet, so
              # it cannot show up in the pending list.
              [ "$f" = "$CHANGE_FILE" ] && continue
              if ! printf '%s\n' "$PENDING" | grep -qxF "$f"; then
                echo "🧹 clearing released note $f (shipped in ${LAST_TAG})"
                rm -f "$f"
              fi
            done
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "changes/"
          git diff --cached --quiet || git commit -m "changelog: add entry for PR #${PR_NUMBER} [skip ci]"
          git push
